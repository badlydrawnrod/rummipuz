<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rummipuz core checks</title>
  <h1>Rummipuz core checks</h1>
  <pre id="results" role="status">Running…</pre>
  <script type="module">
    import { runCoreChecks } from './core.js';
    import { runSolverChecks } from './solver.js';
    import { runGeneratorChecks } from './generator.js';
    import { runDifficultyChecks } from './difficulty.js';
    import { runReviewChecks } from './review.js';
    import { runAppearanceChecks } from './appearance.js';
    import { runPlayChecks } from './play.js';
    import { runProgressChecks } from './progress.js';
    import { runPreferenceChecks } from './preferences.js';
    import { runTouchChecks } from './touch.js';
    import { runOverflowChecks } from './overflow.js';
    import { runWorkerLifecycleChecks, runWorkerChecks } from './worker.js';
    const results = document.querySelector('#results');
    try {
      const response = await fetch('../puzzles/sample.json');
      if (!response.ok) throw new Error(`Fixture request failed: ${response.status}`);
      const sample = await response.json();
      const fixturesResponse = await fetch('./fixtures/generated-v2.json');
      if (!fixturesResponse.ok) throw new Error(`Generation fixture request failed: ${fixturesResponse.status}`);
      const ratedResponse = await fetch('./fixtures/generated-v3.json');
      if (!ratedResponse.ok) throw new Error(`Rated fixture request failed: ${ratedResponse.status}`);
      const reviewedResponse = await fetch('./fixtures/generated-v4.json');
      const handResponse = await fetch('./fixtures/reviewed-v4.json');
      if (!reviewedResponse.ok || !handResponse.ok) throw new Error('Review fixture request failed.');
      const reviewedFixtures = await reviewedResponse.json();
      const candidateFixtures = await fixturesResponse.json();
      const ratedFixtures = await ratedResponse.json();
      const stylesResponse = await fetch('../styles.css');
      if (!stylesResponse.ok) throw new Error('Appearance stylesheet request failed.');
      const styles = await stylesResponse.text();
      const passed = [...runCoreChecks(sample), ...runSolverChecks(sample),
        ...runGeneratorChecks(candidateFixtures),
        ...runDifficultyChecks(sample, ratedFixtures),
        ...runReviewChecks(reviewedFixtures, await handResponse.json()),
        ...await runWorkerLifecycleChecks(),
        ...runPlayChecks(sample),
        ...runProgressChecks(sample),
        ...runPreferenceChecks(),
        ...runAppearanceChecks(styles), ...runTouchChecks(sample, styles), ...runOverflowChecks()];
      results.textContent = `${passed.length} checks passed. Testing real module workers…`;
      passed.push(...await runWorkerChecks(sample,
        [candidateFixtures[0], ratedFixtures[0], reviewedFixtures[0]]));
      results.textContent = `${passed.length} checks passed.\n\n${passed.join('\n')}`;
    } catch (error) {
      results.textContent = error.stack;
      console.error(error);
    }
  </script>
</html>
